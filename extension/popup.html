<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Udemy study tools</title>
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="stylesheet" href="theme.css">
<style>
* {box-sizing:border-box} body {font:14px/1.5 "Segoe UI",Arial,sans-serif;margin:0;padding:20px;width:350px;color:var(--ink);background:var(--bg)}
.brand {display:flex;gap:10px;align-items:center;margin-bottom:20px} h1 {font-size:18px;letter-spacing:-.02em;font-weight:600;margin:0}
h2 {font-size:11px;font-weight:600;color:var(--muted);margin:18px 4px 8px} .group {background:var(--surface);border-radius:16px;padding:4px 14px}
label {display:flex;gap:18px;align-items:center;justify-content:space-between;padding:12px 0;cursor:pointer;font-weight:500}
label + label {border-top:1px solid var(--line)} small {display:block;font-size:12px;line-height:1.5;color:var(--muted);font-weight:400;margin-top:3px}
input {appearance:none;flex:none;width:36px;height:22px;border-radius:14px;border:1px solid var(--muted);margin:0;background:var(--line);position:relative;cursor:pointer;transition:background 160ms}
input::before {content:"";position:absolute;width:14px;height:14px;border-radius:50%;top:3px;left:3px;background:var(--muted);transition:transform 160ms,background 160ms}
input:checked {background:var(--accent);border-color:var(--accent)} input:checked::before {transform:translateX(14px);background:var(--surface)}
:focus-visible {outline:2px solid var(--accent);outline-offset:4px} button {width:100%;padding:12px 16px;border:0;border-radius:24px;color:var(--accent);background:var(--selected);font:500 13px/1.5 "Segoe UI",Arial,sans-serif;cursor:pointer;margin-top:18px;transition:filter 160ms}
button:hover {filter:brightness(.95)} #status {font-size:11px;color:var(--muted);margin:10px 4px 0} .note {font-size:11px;color:var(--muted);margin:10px 4px 0}
@media(prefers-reduced-motion:reduce) {* {transition:none!important}}
</style></head><body>
<header class="brand"><img src="icons/icon-48.png" width="32" height="32" alt=""><h1>Study tools</h1></header>
<h2>Review</h2><section class="group" aria-label="Review settings">
<label for="focusReview"><span>Focused review<small>One question and explanation at a time.</small></span><input id="focusReview" type="checkbox" role="switch"></label>
<label for="darkMode"><span>Dark mode<small>For your Udemy pages and study tools.</small></span><input id="darkMode" type="checkbox" role="switch"></label>
</section>
<p class="note">Using Dark Reader? Turn it off for Udemy when using this theme.</p>
<h2>During an exam</h2><section class="group" aria-label="Exam settings">
<label for="fullHeight"><span>Full-height view</span><input id="fullHeight" type="checkbox" role="switch"></label>
<label for="hidePause"><span>Hide pause screen<small>Removes blur. The timer stays paused.</small></span><input id="hidePause" type="checkbox" role="switch"></label>
<label for="keepRunning"><span>Keep exam running<small>Auto-resumes all pauses, including manual ones. The timer keeps running.</small></span><input id="keepRunning" type="checkbox" role="switch"></label>
</section>
<button id="connect">Connect to Python exporter</button>
<p id="status" role="status">Settings are saved across your Udemy tabs.</p>
<script src="popup.js"></script></body></html>

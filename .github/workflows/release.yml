name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify release version
        shell: python
        run: |
          import json, os
          version = json.load(open('extension/manifest.json'))['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and manifest versions differ'
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - if: runner.os != 'Linux'
        run: python tools/build_release.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build_release.py
      - name: Check Linux installation and desktop launcher
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils
          export XDG_DATA_HOME="$(mktemp -d)"
          dist/UdemyStudyTools/UdemyStudyTools --install
          desktop-file-validate "$XDG_DATA_HOME/applications/com.himanm.UdemyStudyTools.desktop"
          test -f "$HOME/Desktop/com.himanm.UdemyStudyTools.desktop"
          xvfb-run -a "$XDG_DATA_HOME/udemy-study-tools/app/UdemyStudyTools" --smoke-test
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $installPath = Join-Path $env:RUNNER_TEMP 'study-install'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $installPath + '"') -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $smoke = Start-Process -FilePath (Join-Path $installPath 'UdemyStudyTools.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw 'Installed app smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/*-chrome.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "Udemy Study Tools ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md

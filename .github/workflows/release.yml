name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build only (no publishing): version such as 1.5.0-rc.1; blank uses manifest'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - id: release
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: python tools/release_metadata.py --version "$RELEASE_VERSION" --github-output "$GITHUB_OUTPUT"
  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml
  build:
    needs: [metadata, checks]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set packaged release version
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: python tools/release_metadata.py --version "$RELEASE_VERSION" --prepare
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - if: runner.os != 'Linux'
        run: python tools/build_release.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build_release.py
      - name: Check Linux installation and desktop launcher
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils
          export XDG_DATA_HOME="$(mktemp -d)"
          dist/StudyDock --install
          desktop-file-validate "$XDG_DATA_HOME/applications/com.himanm.UdemyStudyTools.desktop"
          test -f "$HOME/Desktop/com.himanm.UdemyStudyTools.desktop"
          test -f "$XDG_DATA_HOME/udemy-study-tools/app/studydock.png"
          xvfb-run -a "$XDG_DATA_HOME/udemy-study-tools/app/StudyDock" --smoke-test
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $installPath = Join-Path $env:RUNNER_TEMP 'study-install'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $installPath + '"') -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $smoke = Start-Process -FilePath (Join-Path $installPath 'StudyDock.exe') -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw 'Installed app smoke test failed' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/*.dmg
            dist/*.bin
          if-no-files-found: error
          retention-days: 14
  extension:
    needs: [metadata, checks]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Package browser extension separately
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python tools/release_metadata.py --version "$RELEASE_VERSION" --prepare
          python tools/build_browser_download.py --output "dist/StudyDock-$RELEASE_VERSION-browser-extension.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-browser-extension
          path: dist/*-browser-extension.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [metadata, build, extension]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          pattern: packages-*
          merge-multiple: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare download buttons and release notes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
        run: python tools/release_notes.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --store-url "$CHROME_STORE_URL" --output release-body.md
      - name: Publish complete, tested release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > existing-draft; then
            test "$(cat existing-draft)" = true || { echo 'Refusing to replace a published release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft "${flags[@]}" --title "StudyDock ${GITHUB_REF_NAME}" --notes-file release-body.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false "${flags[@]}" --notes-file release-body.md

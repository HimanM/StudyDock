name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          check-latest: true
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb desktop-file-utils
      - run: python -m playwright install chrome
      - name: Optional installer checks
        run: python -X utf8 test_install.py
      - name: Release versions, downloads and packaging
        run: python -X utf8 test_release.py
      - name: JavaScript syntax
        shell: bash
        run: for file in extension/*.js; do node --check "$file"; done
      - name: Export and desktop checks
        if: runner.os != 'Linux'
        run: python -X utf8 test_extractor.py
      - name: Export and desktop checks (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -X utf8 test_extractor.py
      - name: Review and extension checks
        run: python -X utf8 test_review.py
      - name: Browser notebook and settings
        run: python -X utf8 test_notebook.py
      - name: Shared portable review
        run: python -X utf8 test_portable_review.py
      - name: Tutorials Dojo result parser
        run: python -X utf8 test_dojo.py

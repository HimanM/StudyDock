name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', 'extension/**', 'tools/build_browser_download.py', 'docs/PRIVACY.md', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'extension/**', 'tools/build_browser_download.py', 'docs/PRIVACY.md', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages at studydock.himanm.com
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: https://studydock.himanm.com/
      NEXT_PUBLIC_REPO_PRIVATE: ${{ github.event.repository.private }}
      NEXT_PUBLIC_CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: website
      - run: npm test && npm run build
        working-directory: website
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python website/test_site.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: website-static
          path: website/out
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        with:
          path: website/out
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
